<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101529"><meta name="description" content="星云AI免费提示词创作与本地作品管理"><title>我的作品 · 星云AI</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/nebula-icon.svg" type="image/svg+xml"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="星云AI">
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f6f5ff;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:24px 18px 80px}a{color:#cdbdff}h1{margin:20px 0 5px;font-size:30px}.muted,small{color:#aeb7d0}.panel{background:#171e33;border:1px solid #343e5e;border-radius:18px;padding:20px;margin:18px 0}label{display:block;margin-top:13px;font-weight:600}input,textarea,select{width:100%;padding:12px;margin-top:6px;border:1px solid #657091;border-radius:10px;background:#0e1529;color:white;font:inherit}textarea{min-height:125px;resize:vertical}button,.btn{display:inline-block;border:0;border-radius:11px;padding:11px 16px;margin:8px 8px 0 0;background:#ad9bff;color:#151029;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}button.secondary{background:#313d59;color:white}button.danger{background:#57313d;color:#ffdce2}.card{border:1px solid #3c4766;border-radius:14px;padding:16px;margin:12px 0;background:#10172a}.card h3{margin:0}.card pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;margin:8px 0;color:#d9dff1}.tools{display:flex;flex-wrap:wrap;gap:5px}.notice{font-size:13px;color:#f0d5a1}#status{min-height:24px;color:#9be5c7}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #80e3f6;outline-offset:2px}</style></head>
<body><main><a href="./index.html">← 返回星云 AI 首页</a><h1>📁 我的作品</h1><p class="muted">免费提示词创作 · 本地保存 · 导出备份</p><p class="notice">作品仅保存在当前设备的本地存储，不会自动云同步。请定期导出备份；不要在此保存密码、访问码或敏感资料。</p>
<section class="panel"><h2>✨ 新建提示词</h2><label for="kind">创作类型</label><select id="kind"><option value="image">AI 绘画提示词</option><option value="video">短视频分镜提示词</option><option value="social">自媒体文案提示词</option></select><label for="title">作品名称</label><input id="title" maxlength="80" placeholder="例如：月球橘猫封面"><label for="idea">创意描述</label><textarea id="idea" maxlength="4000" placeholder="写下你想创作的内容、场景、人物和风格"></textarea><label for="style">风格</label><select id="style"><option>电影写实</option><option>极简高级</option><option>国风美学</option><option>动漫插画</option><option>自然纪实</option></select><div class="tools"><button id="generate">免费生成提示词</button><button class="secondary" id="save">保存到我的作品</button></div><label for="output">可编辑的生成结果</label><textarea id="output" maxlength="12000" placeholder="生成后可以直接编辑"></textarea><div class="tools"><button class="secondary" id="copy">复制结果</button></div><div id="status" role="status"></div></section>
<section class="panel"><h2>🗂️ 已保存作品 <span id="count"></span></h2><label for="search">搜索作品</label><input id="search" placeholder="按名称或内容搜索"><div class="tools"><button class="secondary" id="export">导出全部 JSON 备份</button><label class="btn" for="importFile" style="cursor:pointer">导入 JSON 备份</label><input id="importFile" type="file" accept="application/json,.json" style="display:none"></div><div id="list"></div></section>
</main><script>
(()=>{'use strict';const KEY='nebula-works-v1',MAX=100;const $=id=>document.getElementById(id);const status=s=>$('status').textContent=s;const clean=v=>typeof v==='string'?v.slice(0,12000):'';function read(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(v)?v.filter(x=>x&&typeof x==='object').slice(0,MAX):[]}catch{return []}}function write(items){localStorage.setItem(KEY,JSON.stringify(items.slice(0,MAX)))}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const q=$('search').value.trim().toLowerCase();const items=read();$('count').textContent='('+items.length+'/'+MAX+')';const list=$('list');list.replaceChildren();const matched=items.filter(x=>(clean(x.title)+' '+clean(x.content)).toLowerCase().includes(q));if(!matched.length){list.textContent='还没有符合条件的作品。';return}matched.forEach(x=>{const card=document.createElement('div');card.className='card';const title=document.createElement('h3');title.textContent=clean(x.title)||'未命名作品';const meta=document.createElement('small');meta.textContent=(x.kind==='image'?'绘画':x.kind==='video'?'视频':'文案')+' · '+new Date(x.createdAt||Date.now()).toLocaleString();const pre=document.createElement('pre');pre.textContent=clean(x.content);const edit=document.createElement('button');edit.className='secondary';edit.textContent='载入编辑';edit.onclick=()=>{$('title').value=clean(x.title);$('output').value=clean(x.content);$('kind').value=['image','video','social'].includes(x.kind)?x.kind:'image';scrollTo({top:0,behavior:'smooth'});status('已载入作品，修改后保存会创建一份新作品。')};const del=document.createElement('button');del.className='danger';del.textContent='删除';del.onclick=()=>{if(!confirm('确定删除这份作品吗？此操作不可撤销。'))return;try{write(read().filter(v=>v.id!==x.id));render()}catch{status('删除失败：本地存储不可用')}};card.append(title,meta,pre,edit,del);list.append(card)})}
$('generate').onclick=()=>{const idea=$('idea').value.trim();if(!idea){status('请先填写创意描述');return}const style=$('style').value,kind=$('kind').value;const prefix=kind==='image'?'请创作一幅高质量画面':kind==='video'?'请设计一组连贯的短视频分镜':'请撰写一篇适合自媒体发布的原创内容';const ending=kind==='image'?'主体清晰，构图合理，光影自然，细节丰富，避免多余文字和水印。':kind==='video'?'按镜头列出景别、运镜、动作、时长和转场，保持角色与场景一致。':'给出吸引人的标题、开头、正文结构、结尾互动话术，语言自然，避免夸大承诺。';$('output').value=prefix+'。\n创意主题：'+idea+'\n视觉与表达风格：'+style+'。\n制作要求：'+ending;status('已生成本地模板提示词（不调用 AI 接口）。')};
$('save').onclick=()=>{const content=$('output').value.trim(),title=$('title').value.trim();if(!title||!content){status('请先填写作品名称并生成或输入内容');return}try{const items=read();if(items.length>=MAX){status('最多保存100份作品，请先导出备份并删除旧作品');return}items.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),title:clean(title),content:clean(content),kind:$('kind').value,createdAt:new Date().toISOString()});write(items);render();status('已保存在当前设备。建议定期导出备份。')}catch{status('保存失败：本地存储不可用或空间不足')}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('output').value);status('已复制')}catch{status('复制失败，请长按结果手动复制')}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'nebula-works-v1',items:read()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nebula-works-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(file.size>2000000){status('备份文件不能超过2MB');return}try{const data=JSON.parse(await file.text());if(data.format!=='nebula-works-v1'||!Array.isArray(data.items))throw Error('格式不正确');const valid=data.items.slice(0,MAX).filter(x=>x&&typeof x.title==='string'&&typeof x.content==='string').map(x=>({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),title:clean(x.title),content:clean(x.content),kind:['image','video','social'].includes(x.kind)?x.kind:'image',createdAt:new Date().toISOString()}));if(!confirm('导入'+valid.length+'份作品？将与现有作品合并，最多保留100份。'))return;write([...valid,...read()].slice(0,MAX));render();status('备份导入完成')}catch{status('导入失败：请使用本页面导出的 JSON 备份')}finally{e.target.value=''}};
$('search').oninput=render;render();if('serviceWorker'in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
})();
</script></body></html>
