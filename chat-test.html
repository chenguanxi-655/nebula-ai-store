<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>星云 AI · 对话测试</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f2f4ff;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:760px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:18px 16px 22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 18px}h1{font-size:22px;margin:0}.muted{color:#aab3ca;font-size:12px}a{color:#c7b8ff;text-decoration:none}.tag{font-size:11px;border:1px solid #3a4260;padding:5px 8px;border-radius:20px;color:#bac4dd}.settings{background:#171e34;border:1px solid #323c5b;padding:14px;border-radius:16px;margin-bottom:14px}label{display:block;font-size:12px;color:#b9c3da;margin-bottom:8px}input{display:block;width:100%;margin-top:5px;padding:11px;background:#0b1123;border:1px solid #3b4869;color:white;border-radius:10px;font-size:15px}.note{color:#d3bd88;font-size:12px;margin:9px 0 0}.chat{flex:1;min-height:300px;display:flex;flex-direction:column;gap:14px;overflow:auto;padding:14px 2px 22px}.bubble{max-width:88%;padding:12px 15px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.mine{align-self:flex-end;background:#6758d7}.ai{align-self:flex-start;background:#1d2844;border:1px solid #34415d}.empty{margin:auto;text-align:center;color:#aab3ca}.composer{display:flex;gap:8px;align-items:flex-end;border:1px solid #3a4564;background:#151d32;padding:9px;border-radius:16px}textarea{flex:1;resize:none;min-height:48px;max-height:150px;background:transparent;color:white;border:0;outline:0;font:15px/1.5 inherit;padding:12px}button{background:#7b6af0;border:0;border-radius:10px;color:white;padding:12px 15px;font-size:13px;font-weight:600;cursor:pointer}button:disabled{opacity:.45}#status{min-height:22px;margin:8px 3px;color:#b5bed4;font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:8px}.secondary{background:#28324c}.warn{font-size:11px;color:#aab3ca;padding:6px 0}</style></head>
<body><main class="wrap"><header><div><div class="muted">✦ NEBULA / AI TOOLS</div><h1>星云 AI 对话</h1></div><span class="tag">开发测试版</span></header>
<section class="settings"><label>测试访问码（仅保存在当前页面内存，不写入浏览器存储）<input id="code" type="password" autocomplete="off" placeholder="输入 sTUDIO_ACCESS_CODE"></label><p class="note">仅供项目开发者测试。不要向普通用户分发访问码；正式上线前需要服务端用户鉴权与限额。</p></section>
<div class="toolbar"><span class="muted">智谱 · GLM-4-Flash</span><button id="clear" class="secondary" style="margin-left:auto">清空对话</button></div>
<section class="chat" id="chat" aria-live="polite"><div class="empty" id="empty">✨ 星云 AI 已就绪<br><small>输入一句话，开始真实模型对话测试</small></div></section>
<form id="form"><div class="composer"><textarea id="prompt" maxlength="2000" rows="2" placeholder="输入你想问的问题…" required></textarea><button id="send" type="submit">发送</button></div><div id="status" role="status"></div></form>
<div class="warn">本页仅作单轮调用验证，界面保留历史消息，但后端每次仅接收当前提问。可能产生模型调用费用。</div></main>
<script>
(()=>{'use strict';
const API='https://nebula-api-test-jzhuzmpvbd.cn-hangzhou.fcapp.run/api/v1/chat';
const $=id=>document.getElementById(id);let busy=false;
function add(role,content){$('empty')?.remove();const d=document.createElement('div');d.className='bubble '+(role==='user'?'mine':'ai');d.textContent=content;$('chat').append(d);d.scrollIntoView({block:'end',behavior:'smooth'});}
$('clear').onclick=()=>{$('chat').replaceChildren();const d=document.createElement('div');d.className='empty';d.id='empty';d.textContent='对话已清空';$('chat').append(d);$('status').textContent='';};
$('form').onsubmit=async e=>{e.preventDefault();if(busy)return;const code=$('code').value.trim(),message=$('prompt').value.trim();if(!code){$('status').textContent='请先填写测试访问码';return}if(!message)return;
busy=true;$('send').disabled=true;add('user',message);$('prompt').value='';$('status').textContent='星云正在思考…';const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),45000);
try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Code':code},body:JSON.stringify({messages:[{role:'user',content:message}]}),signal:ctrl.signal,cache:'no-store'});const json=await res.json().catch(()=>({}));if(!res.ok)throw Error('HTTP '+res.status+'：'+(json.error||json.detail||'请求失败'));const answer=json.reply??json.answer??json.data?.reply;if(typeof answer!=='string'||!answer.trim())throw Error('接口返回成功，但未找到 AI 回复字段');add('assistant',answer);$('status').textContent='已收到真实接口回复';}catch(err){$('status').textContent='请求失败：'+err.message;}finally{clearTimeout(timer);busy=false;$('send').disabled=false;}};
})();
</script></body></html>
