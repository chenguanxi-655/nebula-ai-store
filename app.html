<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b14">
<title>星云 · 封面工坊</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/nebula-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星云">
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 70% 50% at 50% -10%,#1b2b4a 0%,#080b14 55%);color:#f2f5ff;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:#9fd9f5;text-decoration:none}
header{padding:14px 18px;display:flex;align-items:center;gap:10px;max-width:860px;width:100%;margin:0 auto}
.logo{font-weight:850;font-size:17px;letter-spacing:-.4px;display:flex;align-items:center;gap:7px}
.logo i{color:#7ae6f8;font-style:normal}
.spacer{flex:1}
.iconbtn{background:#151d2e;border:1px solid #2c3a54;color:#b9c9e0;font-size:13px;padding:7px 12px;border-radius:10px;font-weight:650;cursor:pointer}
main{flex:1;max-width:860px;width:100%;margin:0 auto;padding:8px 18px 90px}
h1{font-size:clamp(26px,5.5vw,38px);letter-spacing:-1px;margin:18px 0 8px;line-height:1.2}
h1 span{background:linear-gradient(105deg,#8fe7ff,#b7a4ff);background-clip:text;color:transparent}
.lead{color:#8d9cb8;font-size:14px;margin:0 0 22px}
.box{background:#0f1626;border:1px solid #26324a;border-radius:18px;padding:14px}
textarea{width:100%;font:inherit;font-size:16px;background:#0a101c;border:1px solid #2e3d58;border-radius:13px;color:#fff;padding:14px;min-height:74px;resize:none;line-height:1.55}
textarea::placeholder{color:#5f6d87}
.row{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.seg{display:flex;background:#0a101c;border:1px solid #2e3d58;border-radius:11px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;color:#8fa1bd;font:inherit;font-size:13px;font-weight:650;padding:8px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:#22304a;color:#d7ecff}
.go{margin-left:auto;background:linear-gradient(110deg,#7ae6f8,#a9a3ff);color:#07101f;border:0;font:inherit;font-weight:850;font-size:15px;padding:11px 22px;border-radius:11px;cursor:pointer}
.go:disabled{opacity:.5;cursor:not-allowed}
.status{min-height:20px;font-size:13px;margin-top:10px;color:#8d9cb8}
.status.ok{color:#8ff0d6}
.status.err{color:#ffb3be}
.hint{font-size:12px;color:#61708b;margin-top:9px;line-height:1.6}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.chip{background:#121c2e;border:1px solid #27354d;color:#9fb4cf;font-size:12px;padding:7px 11px;border-radius:99px;font-weight:600;cursor:pointer}

#grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
@media(min-width:720px){#grid{grid-template-columns:repeat(4,1fr)}}
.card{border-radius:14px;overflow:hidden;background:#0d1422;border:1px solid #24314a;display:flex;flex-direction:column}
.thumb{position:relative;background:#0a1120;display:grid;place-items:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.card.r916 .thumb{aspect-ratio:9/16}
.card.r11 .thumb{aspect-ratio:1/1}
.card.r169 .thumb{aspect-ratio:16/9}
.ph{position:absolute;inset:0;display:grid;place-items:center;color:#54637e;font-size:12px;text-align:center;padding:8px;line-height:1.5;background:linear-gradient(135deg,#0d1524,#111a2b)}
.spin{width:22px;height:22px;border:2px solid #2b3a55;border-top-color:#7ae6f8;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.meta{padding:9px 10px 10px}
.tag{font-size:11px;color:#7ae6f8;font-weight:700;letter-spacing:.5px}
.cap{font-size:13px;line-height:1.5;color:#dbe6f5;margin-top:4px;min-height:20px;overflow-wrap:anywhere}
.cap.loading{color:#5d6d88}
.acts{display:flex;gap:6px;margin-top:8px}
.acts a,.acts button{flex:1;text-align:center;font-size:12px;font-weight:650;padding:7px;border-radius:8px;border:1px solid #2f3f5b;background:#141f32;color:#bcd0e8;cursor:pointer}
.errbox{color:#ffb3be;font-size:12px;padding:10px;text-align:center;line-height:1.5}

.bar{max-width:860px;width:100%;margin:0 auto;padding:0 18px 10px;display:flex;gap:9px}
.mini{background:#141f32;border:1px solid #2f3f5b;color:#bcd0e8;font-size:13px;font-weight:650;padding:9px 14px;border-radius:10px;cursor:pointer}
footer{color:#4f5d78;font-size:11px;text-align:center;padding:6px 18px 26px;line-height:1.7}

.sheet{position:fixed;inset:0;background:#05080fdd;backdrop-filter:blur(4px);display:none;place-items:center;padding:18px;z-index:50}
.sheet.show{display:grid}
.panel{width:100%;max-width:440px;background:#0f1626;border:1px solid #2b3a54;border-radius:18px;padding:18px}
.panel h3{margin:0 0 4px;font-size:16px}
.panel p{color:#7f8ea9;font-size:12px;margin:0 0 14px;line-height:1.6}
.panel label{display:block;font-size:12px;font-weight:650;margin:11px 0 6px;color:#a8b8d0}
.panel input[type=url],.panel input[type=password]{width:100%;font:inherit;font-size:14px;background:#0a101c;border:1px solid #2e3d58;border-radius:10px;color:#fff;padding:11px}
.chk{display:flex;gap:7px;align-items:center;font-size:12px;color:#8fa1bd;margin-top:10px}
.chk input{width:auto;accent-color:#76e1f3}
.prow{display:flex;gap:9px;margin-top:16px}
.prow button{flex:1;font:inherit;font-weight:750;padding:11px;border-radius:10px;border:0;cursor:pointer}
.prow .p{background:linear-gradient(110deg,#7ae6f8,#a9a3ff);color:#07101f}
.prow .s{background:#1b2740;color:#c3d4ea}
</style>
</head>
<body>

<header>
  <div class="logo"><i>✦</i> 星云 <span style="font-weight:400;color:#7d8caa">封面工坊</span></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="openSet">设置</button>
</header>

<main>
  <h1>一句话，<span>做一套封面</span></h1>
  <p class="lead">写下主题，一次给你 4 张不同风格的成品，每张都配好标题。</p>

  <div class="box">
    <textarea id="topic" maxlength="300" placeholder="例如：咖啡店开业，秋日暖调，想放在小红书上"></textarea>
    <div class="row">
      <div class="seg" id="seg">
        <button data-r="9:16" class="on">竖版</button>
        <button data-r="1:1">方形</button>
        <button data-r="16:9">横版</button>
      </div>
      <button class="go" id="go">开始生成</button>
    </div>
    <div class="status" id="status"></div>
    <div class="chips" id="chips">
      <button class="chip" data-t="咖啡店开业，秋日暖调，想放在小红书上">咖啡店开业</button>
      <button class="chip" data-t="健身私教课程推广，力量感，深色背景">健身课推广</button>
      <button class="chip" data-t="儿童绘本推荐，温柔治愈，水彩质感">绘本推荐</button>
      <button class="chip" data-t="数码产品评测封面，科技感，冷色调">数码评测</button>
    </div>
    <div class="hint">一次生成 4 张，消耗 4 次调用额度。想省钱可以先选 1 张试试（下方设置里可改）。</div>
  </div>

  <div id="grid"></div>
</main>

<div class="bar" id="bar" style="display:none">
  <button class="mini" id="again">↻ 换一批</button>
  <button class="mini" id="dlAll">⬇ 全部下载</button>
  <button class="mini" id="copyCaps">复制全部标题</button>
</div>

<footer>每日有调用次数限制 · 图片只在本页显示，记得下载保存</footer>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>连接设置</h3>
    <p>填一次就记住。后端地址不是密码；访问码只存在这台设备上。</p>
    <label for="endpoint">后端地址</label>
    <input id="endpoint" type="url" placeholder="https://xxx.fcapp.run" spellcheck="false" autocomplete="off">
    <label for="access">访问码</label>
    <input id="access" type="password" placeholder="STUDIO_ACCESS_CODE" autocomplete="off">
    <div class="chk"><input type="checkbox" id="remember"><label for="remember" style="margin:0;font-weight:500">在这台设备记住访问码</label></div>
    <div class="chk"><input type="checkbox" id="oneOnly"><label for="oneOnly" style="margin:0;font-weight:500">每批只生成 1 张（省额度）</label></div>
    <div class="prow">
      <button class="s" id="closeSet">取消</button>
      <button class="p" id="test">测试并保存</button>
    </div>
    <div class="status" id="setStatus" style="margin-top:10px"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const K = { ep: 'nebula-endpoint-v1', code: 'nebula-chat-code-v1', one: 'nebula-one-only' };
  const DEF_EP = 'https://nebula-ai-api-tggdrlrikm.cn-hangzhou.fcapp.run';

  const STYLES = [
    { tag: '极简', hint: '极简高级排版，大面积留白，主体居中，克制配色，商业感' },
    { tag: '暖调', hint: '暖色电影光，柔和氛围，生活气息，质感细腻' },
    { tag: '撞色', hint: '高对比撞色，强烈视觉冲击，潮流风格，适合社媒封面' },
    { tag: '胶片', hint: '胶片摄影质感，轻微颗粒，低饱和，复古文艺' }
  ];

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} }
  };

  let ratio = '9:16';
  let busy = false;

  function ep() {
    let v = (($('endpoint').value || '').trim() || store.get(K.ep) || DEF_EP).replace(/\/+$/, '');
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }
  function code() { return ($('access').value || store.get(K.code) || '').trim(); }
  function say(t, k) { const s = $('status'); s.textContent = t || ''; s.className = 'status ' + (k || ''); }
  function saySet(t, k) { const s = $('setStatus'); s.textContent = t || ''; s.className = 'status ' + (k || ''); }

  // 初始化
  $('endpoint').value = store.get(K.ep) || DEF_EP;
  if (store.get(K.code)) { $('access').value = store.get(K.code); $('remember').checked = true; }
  if (store.get(K.one)) $('oneOnly').checked = true;
  $('openSet').onclick = () => { $('sheet').classList.add('show'); saySet(''); };
  $('closeSet').onclick = () => $('sheet').classList.remove('show');
  $('sheet').addEventListener('click', e => { if (e.target === $('sheet')) $('sheet').classList.remove('show'); });

  $('test').onclick = async () => {
    const e = ep(), c = $('access').value.trim();
    saySet('正在测试…');
    try {
      const r = await fetch(e + '/health', { cache: 'no-store' });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.ok) throw new Error('后端返回 ' + r.status);
      store.set(K.ep, e);
      if (!c) { saySet('后端通了，请再填访问码。', 'err'); return; }
      const t = await fetch(e + '/self-test', { headers: { 'X-Studio-Code': c }, cache: 'no-store' });
      const td = await t.json().catch(() => ({}));
      if (!t.ok || !td.ok) throw new Error(td.detail || td.error || ('返回 ' + t.status));
      if ($('remember').checked) store.set(K.code, c); else store.del(K.code);
      if ($('oneOnly').checked) store.set(K.one, '1'); else store.del(K.one);
      saySet('✅ 已保存，可以生成了', 'ok');
      setTimeout(() => $('sheet').classList.remove('show'), 800);
    } catch (err) {
      saySet('❌ ' + (err.message || '连不上'), 'err');
    }
  };

  $('seg').addEventListener('click', e => {
    const b = e.target.closest('button[data-r]');
    if (!b) return;
    ratio = b.dataset.r;
    [...$('seg').children].forEach(x => x.classList.toggle('on', x === b));
  });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (b) { $('topic').value = b.dataset.t; $('topic').focus(); }
  });

  function card(i, style) {
    const c = document.createElement('div');
    c.className = 'card r' + ratio.replace(':', '');
    const th = document.createElement('div');
    th.className = 'thumb';
    const ph = document.createElement('div');
    ph.className = 'ph';
    ph.innerHTML = '<div><div class="spin" style="margin:0 auto 8px"></div>生成中…</div>';
    th.append(ph);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const tag = document.createElement('div');
    tag.className = 'tag';
    tag.textContent = style.tag;
    const cap = document.createElement('div');
    cap.className = 'cap loading';
    cap.textContent = '标题生成中…';
    meta.append(tag, cap);
    c.append(th, meta);
    $('grid').append(c);
    return { c, th, ph, cap };
  }

  function failCard(ref, msg) {
    ref.ph.replaceChildren();
    const d = document.createElement('div');
    d.className = 'errbox';
    d.textContent = msg;
    ref.ph.append(d);
    ref.cap.textContent = '';
    ref.cap.className = 'cap';
  }

  function fillCard(ref, image) {
    ref.ph.replaceChildren();
    const img = new Image();
    img.alt = '生成的封面';
    img.src = image;
    ref.th.append(img);
    const acts = document.createElement('div');
    acts.className = 'acts';
    const a = document.createElement('a');
    a.href = image;
    a.download = '星云封面-' + Date.now() + '.png';
    a.textContent = '下载';
    acts.append(a);
    ref.c.append(acts);
  }

  async function callImage(prompt, r) {
    const res = await fetch(ep() + '/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Studio-Code': code() },
      body: JSON.stringify({ prompt, ratio: r })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.detail ? d.error + '：' + d.detail : (d.error || ('失败 ' + res.status)));
    if (!d.image) throw new Error('没有收到图片');
    return d.image;
  }

  async function callCaptions(topic, tags) {
    const q = '我在做一组封面，主题是：' + topic + '。四张图的风格分别是：' + tags.join('、') +
      '。请为每张各写一句中文标题，12 字以内，口语化、有吸引力。每行一条，只输出 4 行标题，不要编号、不要解释。';
    const res = await fetch(ep() + '/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Studio-Code': code() },
      body: JSON.stringify({ messages: [{ role: 'user', content: q }] })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || !d.reply) return null;
    return String(d.reply).split('\n')
      .map(s => s.replace(/^[\s\d.、)（(]+/, '').trim())
      .filter(Boolean);
  }

  async function run() {
    const topic = $('topic').value.trim();
    if (!topic) { say('先写一句主题，比如「咖啡店开业，秋日暖调」', 'err'); $('topic').focus(); return; }
    if (!code()) { say('先点右上角「设置」，填一下访问码。', 'err'); $('sheet').classList.add('show'); return; }

    busy = true;
    $('go').disabled = true;
    $('bar').style.display = 'none';
    $('grid').replaceChildren();
    say('正在生成…大概 30~60 秒，请不要关页面');

    const one = $('oneOnly').checked;
    const list = one ? [STYLES[0]] : STYLES;
    const refs = list.map(s => card(0, s));

    const jobs = list.map((s, i) =>
      callImage(topic + '。画面要求：' + s.hint + '。主体清晰，适合做封面，画面中不要出现文字。', ratio)
        .then(img => { fillCard(refs[i], img); return img; })
        .catch(e => { failCard(refs[i], '生成失败：' + (e.message || '未知')); return null; })
    );

    const first = await Promise.all(jobs);
    const okCount = first.filter(Boolean).length;

    if (!okCount) {
      say('这一批都失败了。检查一下访问码或额度。', 'err');
      busy = false; $('go').disabled = false;
      return;
    }

    say('图片好了，正在配标题…', 'ok');
    try {
      const caps = await callCaptions(topic, list.map(s => s.tag));
      if (caps && caps.length) {
        refs.forEach((r, i) => {
          const t = caps[i] || caps[0] || '';
          if (r.cap && t) { r.cap.textContent = '「' + t + '」'; r.cap.className = 'cap'; }
          else if (r.cap) { r.cap.textContent = ''; }
        });
      } else {
        refs.forEach(r => { r.cap.textContent = ''; r.cap.className = 'cap'; });
      }
    } catch (e) {
      refs.forEach(r => { r.cap.textContent = ''; r.cap.className = 'cap'; });
    }

    say('搞定，共 ' + okCount + ' 张。喜欢就下载，不满意点「换一批」。', 'ok');
    $('bar').style.display = 'flex';
    busy = false;
    $('go').disabled = false;
  }

  $('go').onclick = run;
  $('again').onclick = () => { if (!busy) run(); };
  $('dlAll').onclick = () => {
    const links = [...document.querySelectorAll('#grid .acts a')];
    if (!links.length) return;
    links.forEach((a, i) => setTimeout(() => a.click(), i * 400));
  };
  $('copyCaps').onclick = async () => {
    const caps = [...document.querySelectorAll('#grid .cap')].map(c => c.textContent.replace(/[「」]/g, '')).filter(Boolean);
    if (!caps.length) return;
    try { await navigator.clipboard.writeText(caps.join('\n')); say('标题已复制', 'ok'); }
    catch { say('复制不了，请长按手动复制', 'err'); }
  };
  $('topic').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  });

  if (!code()) setTimeout(() => $('sheet').classList.add('show'), 300);
})();
</script>
</body>
</html>
