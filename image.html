<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星云 AI · 图片生成</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#f5f3ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:24px 18px 70px}a{color:#c9b9ff}h1{font-size:34px;margin:28px 0 8px}p{color:#b6b9d0;line-height:1.65}.card{background:#1a2037;border:1px solid #3b4360;border-radius:18px;padding:19px;margin:20px 0}label{display:block;margin:15px 0 7px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #5a6383;border-radius:11px;background:#0f172b;color:white}textarea{min-height:125px}button{background:#b6a2ff;color:#17112d;border:0;border-radius:12px;padding:13px 19px;font-weight:800;margin-top:16px;font-size:15px}button:disabled{opacity:.6}#result{min-height:60px;overflow-wrap:anywhere}img{max-width:100%;border-radius:14px}small{color:#d9c596;line-height:1.6}#save{display:none;margin-top:14px}</style></head><body><main><a href="./index.html">← 返回星云 AI Studio</a><h1>🎨 AI 图片生成</h1><p>输入描述，调用你自己的安全后端生成图片。首次使用需先部署 Cloudflare Worker。</p><div class="card"><strong>🔒 私人测试配置</strong><label for="endpoint">Cloudflare Worker 地址</label><input id="endpoint" type="url" placeholder="https://你的项目.workers.dev" autocomplete="off" spellcheck="false"><label for="access">私测访问码（不是 API Key）</label><input id="access" type="password" placeholder="填写 Worker 中设置的 STUDIO_ACCESS_CODE" autocomplete="off"><small>请勿在这里填写 OpenAI API Key。页面不会保存访问码。</small></div><div class="card"><label for="prompt">图片描述</label><textarea id="prompt" maxlength="1200" placeholder="例如：一只穿宇航服的橘猫站在月球表面，电影级光影，细节丰富"></textarea><label for="size">图片比例</label><select id="size"><option value="1024x1024">1:1 方形</option><option value="1024x1536">2:3 竖版</option><option value="1536x1024">3:2 横版</option></select><button id="generate">✨ 开始真实生成</button><p id="status" role="status"></p><div id="result"></div><a id="save" download="星云AI生成图片.png">下载生成图片</a></div><p><small>每次成功调用可能产生 API 费用。仅供私测；正式开放公众前需要增加账号鉴权、服务端限流和预算控制。</small></p></main><script>const e=id=>document.getElementById(id);e('generate').onclick=async()=>{const endpoint=e('endpoint').value.trim().replace(/\/+$/,''),code=e('access').value,prompt=e('prompt').value.trim();if(!/^https:\/\/[a-z0-9.-]+\.workers\.dev$/i.test(endpoint)){e('status').textContent='请填写有效的 Cloudflare workers.dev 地址。';return}if(!code||!prompt){e('status').textContent='请填写访问码和图片描述。';return}e('generate').disabled=true;e('status').textContent='正在请求图片模型，请稍候…';e('result').replaceChildren();e('save').style.display='none';try{const r=await fetch(endpoint+'/generate-image',{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Code':code},body:JSON.stringify({prompt,size:e('size').value})});const data=await r.json();if(!r.ok)throw new Error(data.detail||data.error||'请求失败');const img=new Image();img.alt='AI 生成的图片';img.src=data.image;e('result').append(img);e('save').href=data.image;e('save').style.display='inline-block';e('status').textContent='生成成功！可长按图片保存，或点击下载。'}catch(err){e('status').textContent='生成失败：'+err.message}finally{e('generate').disabled=false}};</script></body></html>
