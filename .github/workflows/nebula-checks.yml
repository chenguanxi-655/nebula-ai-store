name: Nebula API checks
on:
  push:
    branches: [feature/nebula-trend-ai-platform, main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check backend/server.mjs
          node --check backend/admin.mjs
          node --check backend/server.test.mjs
      - name: Integration tests
        run: node --test backend/server.test.mjs
      - name: Build web
        run: |
          npm ci
          npm run build:web
