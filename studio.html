<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>星云</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./assets/nebula-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="星云">
<style>
:root{
  --bg:#08080a; --surface:#0e0e11; --surface-2:#141418;
  --line:#1b1b20; --line-2:#26262d;
  --text:#f2f2ef; --muted:#8b8b93; --dim:#5c5c65;
  --accent:#ff5a36;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;display:flex;flex-direction:column;
}
body::before{
  content:"";position:fixed;left:50%;top:-260px;width:900px;height:520px;transform:translateX(-50%);
  background:radial-gradient(ellipse at center,rgba(255,90,54,.07),transparent 68%);
  pointer-events:none;z-index:0;
}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer}

.bar{
  position:sticky;top:0;z-index:20;height:58px;display:flex;align-items:center;gap:18px;
  padding:0 20px;border-bottom:1px solid var(--line);background:rgba(8,8,10,.86);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;letter-spacing:-.2px}
.brand .mark{color:var(--accent);font-size:13px}
.modes{display:flex;gap:2px;margin-left:6px}
.modes button{
  background:transparent;border:0;color:var(--muted);font-size:13px;font-weight:500;
  padding:7px 12px;border-radius:8px;transition:.16s;
}
.modes button:hover{color:var(--text)}
.modes button.on{color:var(--text);background:var(--surface-2)}
.spacer{flex:1}
.ghost{
  background:transparent;border:1px solid var(--line-2);color:var(--muted);
  font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;transition:.16s;
}
.ghost:hover{color:var(--text);border-color:#3a3a44}

main{
  position:relative;z-index:1;flex:1;width:100%;max-width:880px;margin:0 auto;
  padding:44px 20px 120px;
}
.head h1{
  margin:0 0 10px;font-size:clamp(26px,5.2vw,34px);line-height:1.15;
  font-weight:600;letter-spacing:-.9px;
}
.head p{margin:0;color:var(--muted);font-size:14px}

.composer{
  margin-top:26px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--surface);padding:4px;transition:border-color .2s;
}
.composer:focus-within{border-color:#3d3d47}
textarea{
  display:block;width:100%;border:0;outline:0;background:transparent;color:var(--text);
  font:inherit;font-size:16px;line-height:1.6;padding:14px 13px;min-height:88px;max-height:220px;
  resize:none;
}
textarea::placeholder{color:#4a4a53}
.crow{
  display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;flex-wrap:wrap;
}
.seg{display:flex;gap:2px}
.seg button{
  background:transparent;border:0;color:var(--dim);font-size:12px;font-weight:500;
  padding:6px 9px;border-radius:7px;transition:.16s;
}
.seg button:hover{color:var(--muted)}
.seg button.on{color:var(--text);background:var(--surface-2)}
.crow .spacer{flex:1}
.primary{
  background:var(--text);color:#08080a;border:0;font-size:13px;font-weight:600;
  padding:9px 18px;border-radius:9px;display:inline-flex;align-items:center;gap:7px;
  transition:.16s;
}
.primary:hover{background:#fff}
.primary:disabled{opacity:.35;cursor:not-allowed}
.primary .arrow{font-size:15px;line-height:1}

.suggest{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.suggest button{
  background:transparent;border:0;padding:0;color:var(--dim);
  border-bottom:1px solid transparent;transition:.16s;
}
.suggest button:hover{color:var(--muted);border-bottom-color:var(--line-2)}

.status{margin-top:12px;font-size:12.5px;color:var(--dim);min-height:18px;letter-spacing:.1px}
.status.ok{color:#79d3a8}
.status.err{color:var(--accent)}
.status .dot{
  display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;
  margin-right:6px;vertical-align:middle;animation:pulse 1.3s infinite;
}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

.board{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:30px}
@media(min-width:720px){.board{grid-template-columns:repeat(4,1fr)}}
.slot{border-radius:8px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column}
.frame{position:relative;background:#0c0c10;display:grid;place-items:center;overflow:hidden}
.r916 .frame{aspect-ratio:9/16}
.r11 .frame{aspect-ratio:1/1}
.r169 .frame{aspect-ratio:16/9}
.frame img{width:100%;height:100%;object-fit:cover;display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
.skel{position:absolute;inset:0;background:linear-gradient(110deg,#101014 30%,#17171c 50%,#101014 70%);background-size:220% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-120% 0}}
.tagline{padding:7px 9px 9px;font-size:11px;color:var(--dim);letter-spacing:.3px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.tagline .tag{color:var(--muted)}
.tagline a{color:var(--dim);border-bottom:1px solid var(--line-2);font-size:10.5px}
.tagline a:hover{color:var(--text)}
.cap{padding:0 9px 9px;font-size:11.5px;line-height:1.5;color:#9a9aa3;min-height:16px}
.cap.empty{display:none}
.bad{padding:16px 10px;text-align:center;color:#8a5a52;font-size:11px;line-height:1.6}

.tools{margin-top:14px;display:none;gap:14px;font-size:12.5px}
.tools.show{display:flex}
.tools button{background:transparent;border:0;color:var(--dim);padding:0;border-bottom:1px solid transparent}
.tools button:hover{color:var(--text);border-bottom-color:var(--line-2)}

.thread{margin-top:30px;display:none;flex-direction:column;gap:22px}
.thread.show{display:flex}
.turn{display:flex;gap:12px}
.turn .av{
  flex:0 0 18px;height:18px;margin-top:4px;display:grid;place-items:center;
  font-size:11px;color:var(--accent);
}
.turn .tx{flex:1;min-width:0;font-size:15px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
.turn.me .av{color:var(--dim)}
.turn.me .tx{color:#c9c9d0}
.turn.me{justify-content:flex-end}
.turn.me .tx{
  flex:0 1 auto;max-width:86%;background:var(--surface-2);border-radius:12px 12px 4px 12px;
  padding:10px 14px;color:var(--text);
}
.turn .tx .acts{margin-top:8px;display:flex;gap:12px}
.turn .tx .acts button{background:transparent;border:0;color:var(--dim);font-size:11px;padding:0}
.turn .tx .acts button:hover{color:var(--muted)}
.dots{display:inline-flex;gap:4px;align-items:center;height:20px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--dim);animation:pp 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}
.dots i:nth-child(3){animation-delay:.3s}
@keyframes pp{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

.foot{
  position:fixed;left:0;right:0;bottom:0;padding:10px 20px;text-align:center;
  font-size:10.5px;color:#3f3f47;background:linear-gradient(transparent,var(--bg) 55%);
  pointer-events:none;letter-spacing:.2px;
}

.sheet{position:fixed;inset:0;background:rgba(4,4,6,.72);backdrop-filter:blur(6px);display:none;place-items:center;padding:18px;z-index:60}
.sheet.show{display:grid}
.panel{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:22px}
.panel h3{margin:0 0 6px;font-size:15px;font-weight:600}
.panel .sub{color:var(--dim);font-size:12px;margin:0 0 18px;line-height:1.6}
.panel label{display:block;font-size:11px;color:var(--muted);letter-spacing:.4px;margin:14px 0 6px}
.panel input[type=text],.panel input[type=password]{
  width:100%;background:#0a0a0d;border:1px solid var(--line-2);border-radius:9px;
  color:var(--text);font:inherit;font-size:13.5px;padding:10px 11px;outline:0;
}
.panel input:focus{border-color:#3d3d47}
.chk{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:12px;color:var(--muted)}
.chk input{width:auto;margin:0;accent-color:var(--accent)}
.prow{display:flex;gap:9px;margin-top:20px}
.prow button{flex:1;font-size:13px;font-weight:600;padding:10px;border-radius:9px;border:0}
.prow .s{background:transparent;border:1px solid var(--line-2);color:var(--muted)}
.prow .p{background:var(--text);color:#08080a}
.pstatus{font-size:12px;margin-top:12px;min-height:16px;color:var(--dim)}
.pstatus.ok{color:#79d3a8}
.pstatus.err{color:var(--accent)}
</style>
</head>
<body>

<header class="bar">
  <div class="brand"><span class="mark">✦</span>星云</div>
  <nav class="modes">
    <button data-mode="cover" class="on">封面</button>
    <button data-mode="chat">对话</button>
  </nav>
  <div class="spacer"></div>
  <button class="ghost" id="openSet">设置</button>
</header>

<main>
  <div class="head">
    <h1 id="title">把想法写下来。</h1>
    <p id="sub">一次给你四张封面，挑一张就能发。</p>
  </div>

  <div class="composer">
    <textarea id="input" rows="3" placeholder="比如：咖啡店开业，秋日暖调，想发在小红书"></textarea>
    <div class="crow">
      <div class="seg" id="ratioSeg">
        <button data-r="9:16" class="on">竖版</button>
        <button data-r="1:1">方形</button>
        <button data-r="16:9">横版</button>
      </div>
      <div class="spacer"></div>
      <button class="primary" id="run">生成<span class="arrow">→</span></button>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="suggest" id="suggest">
    <button data-t="咖啡店开业，秋日暖调，想发在小红书">咖啡店开业</button>
    <button data-t="健身私教课程推广，深色背景，力量感">健身课推广</button>
    <button data-t="儿童绘本推荐，温柔治愈，水彩质感">绘本推荐</button>
    <button data-t="数码产品评测封面，冷色调，科技感">数码评测</button>
  </div>

  <div class="board" id="board"></div>
  <div class="tools" id="tools">
    <button id="again">↻ 换一批</button>
    <button id="dlAll">↓ 全部下载</button>
    <button id="copyCaps">复制标题</button>
  </div>

  <div class="thread" id="thread"></div>
</main>

<div class="foot">图片只在本页显示，记得下载保存 · 每日有调用次数限制</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h3>连接</h3>
    <p class="sub">填一次就好。地址不是密码，访问码只保存到这台设备。</p>
    <label for="endpoint">后端地址</label>
    <input id="endpoint" type="text" placeholder="https://xxx.fcapp.run" spellcheck="false" autocomplete="off">
    <label for="access">访问码</label>
    <input id="access" type="password" placeholder="STUDIO_ACCESS_CODE" autocomplete="off">
    <div class="chk"><input type="checkbox" id="remember"><label for="remember" style="margin:0">在这台设备记住访问码</label></div>
    <div class="chk"><input type="checkbox" id="oneOnly"><label for="oneOnly" style="margin:0">每批只生成 1 张（省额度）</label></div>
    <div class="prow">
      <button class="s" id="closeSet">取消</button>
      <button class="p" id="test">测试并保存</button>
    </div>
    <div class="pstatus" id="pstatus"></div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const K = { ep:'nebula-endpoint-v1', code:'nebula-chat-code-v1', one:'nebula-one-only', hist:'nebula-chat-history-v1' };
  const DEF_EP = 'https://nebula-ai-api-tggdrlrikm.cn-hangzhou.fcapp.run';
  const STYLES = [
    { tag:'极简', hint:'极简高级排版，大面积留白，主体居中，克制配色，商业感' },
    { tag:'暖调', hint:'暖色电影光，柔和氛围，生活气息，质感细腻' },
    { tag:'撞色', hint:'高对比撞色，强烈视觉冲击，潮流风格，适合社媒封面' },
    { tag:'胶片', hint:'胶片摄影质感，轻微颗粒，低饱和，复古文艺' }
  ];
  const store = {
    get:k=>{try{return localStorage.getItem(k)}catch{return null}},
    set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}},
    del:k=>{try{localStorage.removeItem(k)}catch{}}
  };

  let mode = 'cover';
  let ratio = '9:16';
  let busy = false;
  let chat = [];

  const ep = () => {
    let v = (($('#endpoint').value||'').trim() || store.get(K.ep) || DEF_EP).replace(/\/+$/,'');
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  };
  const code = () => (($('#access').value||'') || store.get(K.code) || '').trim();

  function say(t, kind) {
    const el = $('#status');
    el.className = 'status ' + (kind||'');
    if (t && kind === 'wait') el.innerHTML = '<span class="dot"></span>' + t;
    else el.textContent = t || '';
  }

  /* ---------- 设置 ---------- */
  $('#endpoint').value = store.get(K.ep) || DEF_EP;
  if (store.get(K.code)) { $('#access').value = store.get(K.code); $('#remember').checked = true; }
  if (store.get(K.one)) $('#oneOnly').checked = true;
  $('#openSet').onclick = () => { $('#sheet').classList.add('show'); $('#pstatus').textContent=''; };
  $('#closeSet').onclick = () => $('#sheet').classList.remove('show');
  $('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) $('#sheet').classList.remove('show'); });

  $('#test').onclick = async () => {
    const e = ep(), c = ($('#access').value||'').trim();
    const st = $('#pstatus');
    st.className='pstatus'; st.textContent='测试中…';
    try {
      const r = await fetch(e + '/health', { cache:'no-store' });
      const d = await r.json().catch(()=>({}));
      if (!r.ok || !d.ok) throw new Error('后端返回 ' + r.status);
      store.set(K.ep, e);
      if (!c) { st.className='pstatus err'; st.textContent='后端通了，请再填访问码。'; return; }
      const t = await fetch(e + '/self-test', { headers:{'X-Studio-Code':c}, cache:'no-store' });
      const td = await t.json().catch(()=>({}));
      if (!t.ok || !td.ok) throw new Error(td.detail || td.error || ('返回 ' + t.status));
      if ($('#remember').checked) store.set(K.code, c); else store.del(K.code);
      if ($('#oneOnly').checked) store.set(K.one,'1'); else store.del(K.one);
      st.className='pstatus ok'; st.textContent='已保存。';
      setTimeout(()=>$('#sheet').classList.remove('show'), 700);
    } catch (err) {
      st.className='pstatus err'; st.textContent = err.message || '连不上';
    }
  };

  /* ---------- 模式切换 ---------- */
  document.querySelectorAll('.modes button').forEach(b => b.onclick = () => {
    mode = b.dataset.mode;
    document.querySelectorAll('.modes button').forEach(x => x.classList.toggle('on', x === b));
    const cover = mode === 'cover';
    $('#ratioSeg').style.display = cover ? 'flex' : 'none';
    $('#suggest').style.display = cover ? 'flex' : 'none';
    $('#board').style.display = cover ? 'grid' : 'none';
    $('#thread').classList.toggle('show', !cover);
    $('#title').textContent = cover ? '把想法写下来。' : '说点什么。';
    $('#sub').textContent = cover ? '一次给你四张封面，挑一张就能发。' : '免费模型，问什么都行。';
    $('#input').placeholder = cover ? '比如：咖啡店开业，秋日暖调，想发在小红书' : '问一个问题，或者让我帮你写点东西…';
    $('#run').innerHTML = cover ? '生成<span class="arrow">→</span>' : '发送<span class="arrow">→</span>';
    $('#run').style.display = cover ? '' : 'none';
    if (!cover) { paintThread(); $('#input').focus(); }
  });

  $('#ratioSeg').onclick = e => {
    const b = e.target.closest('button[data-r]'); if (!b) return;
    ratio = b.dataset.r;
    [...$('#ratioSeg').children].forEach(x => x.classList.toggle('on', x === b));
  };
  $('#suggest').onclick = e => {
    const b = e.target.closest('button[data-t]'); if (!b) return;
    $('#input').value = b.dataset.t; $('#input').focus();
  };

  /* ---------- 封面 ---------- */
  function slot(style) {
    const s = document.createElement('div');
    s.className = 'slot r' + ratio.replace(':','');
    s.innerHTML =
      '<div class="frame"><div class="skel"></div></div>' +
      '<div class="tagline"><span class="tag">' + style.tag + '</span><a>下载</a></div>' +
      '<div class="cap empty"></div>';
    $('#board').append(s);
    return s;
  }
  function fill(s, img) {
    const f = s.querySelector('.frame');
    f.innerHTML = '';
    const i = new Image(); i.src = img; i.alt = '封面'; f.append(i);
    const a = s.querySelector('.tagline a');
    a.href = img; a.download = '星云-' + Date.now() + '.png';
  }
  function fail(s, msg) {
    const f = s.querySelector('.frame');
    f.innerHTML = '<div class="bad">' + msg + '</div>';
    s.querySelector('.tagline a').remove();
  }

  async function genImage(prompt, r) {
    const res = await fetch(ep() + '/generate-image', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Studio-Code':code()},
      body: JSON.stringify({ prompt, ratio: r })
    });
    const d = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(d.detail ? d.error + '：' + d.detail : (d.error || ('失败 ' + res.status)));
    if (!d.image) throw new Error('没有收到图片');
    return d.image;
  }
  async function genCaps(topic, tags) {
    const q = '封面主题：' + topic + '。四张图风格：' + tags.join('、') +
      '。为每张各写一句中文标题，12 字以内，口语化。只输出 4 行，不要编号和解释。';
    const res = await fetch(ep() + '/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Studio-Code':code()},
      body: JSON.stringify({ messages:[{role:'user',content:q}] })
    });
    const d = await res.json().catch(()=>({}));
    if (!res.ok || !d.reply) return null;
    return String(d.reply).split('\n').map(x=>x.replace(/^[\s\d.、)（(]+/,'').trim()).filter(Boolean);
  }

  async function runCover() {
    const topic = $('#input').value.trim();
    if (!topic) { say('先写一句主题。','err'); $('#input').focus(); return; }
    if (!code()) { say('先点右上角「设置」填访问码。','err'); $('#sheet').classList.add('show'); return; }

    busy = true; $('#run').disabled = true;
    $('#board').innerHTML = ''; $('#tools').classList.remove('show');
    say('正在生成，大概半分钟。','wait');

    const list = $('#oneOnly').checked ? [STYLES[0]] : STYLES;
    const slots = list.map(slot);

    const done = await Promise.all(list.map((s,i) =>
      genImage(topic + '。画面要求：' + s.hint + '。主体清晰，适合做封面，画面里不要出现文字。', ratio)
        .then(img => { fill(slots[i], img); return true; })
        .catch(e => { fail(slots[i], '生成失败'); return false; })
    ));
    const ok = done.filter(Boolean).length;
    if (!ok) { say('这批都失败了，检查访问码或额度。','err'); busy=false; $('#run').disabled=false; return; }

    say('配标题中…','wait');
    try {
      const caps = await genCaps(topic, list.map(s=>s.tag));
      if (caps && caps.length) {
        slots.forEach((s,i) => {
          const cap = s.querySelector('.cap');
          const t = caps[i] || '';
          if (t) { cap.textContent = t; cap.classList.remove('empty'); }
        });
      }
    } catch(_) {}

    say('好了，' + ok + ' 张。不满意可以换一批。','ok');
    $('#tools').classList.add('show');
    busy = false; $('#run').disabled = false;
  }

  /* ---------- 对话 ---------- */
  function saveChat() { try { localStorage.setItem(K.hist, JSON.stringify(chat.slice(-120))); } catch(_) {} }
  function loadChat() {
    try {
      const a = JSON.parse(localStorage.getItem(K.hist) || '[]');
      return Array.isArray(a) ? a.filter(m=>m && typeof m.content==='string').slice(-120) : [];
    } catch(_) { return []; }
  }

  function turn(role, text, playback) {
    const d = document.createElement('div');
    d.className = 'turn' + (role === 'user' ? ' me' : '');
    const av = document.createElement('div');
    av.className = 'av';
    av.textContent = role === 'user' ? '你' : '✦';
    const tx = document.createElement('div');
    tx.className = 'tx';
    tx.textContent = text;
    if (role === 'assistant' && !playback) {
      const acts = document.createElement('div');
      acts.className = 'acts';
      const b = document.createElement('button');
      b.textContent = '复制';
      b.onclick = async () => {
        try { await navigator.clipboard.writeText(text); b.textContent='已复制'; setTimeout(()=>b.textContent='复制',1400); }
        catch { b.textContent='长按复制'; }
      };
      acts.append(b); tx.append(acts);
    }
    if (role === 'user') { d.append(tx); d.append(av); }
    else { d.append(av); d.append(tx); }
    $('#thread').append(d);
    window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });
    return d;
  }

  function paintThread() {
    $('#thread').innerHTML = '';
    if (!chat.length) {
      const t = document.createElement('div');
      t.className = 'turn';
      t.innerHTML = '<div class="av">✦</div><div class="tx" style="color:#5c5c65">直接问就好。比如「帮我想 5 个卖手冲咖啡的店名」。</div>';
      $('#thread').append(t);
      return;
    }
    chat.forEach(m => turn(m.role === 'user' ? 'user' : 'assistant', m.content, true));
  }

  async function runChat() {
    const text = $('#input').value.trim();
    if (!text) return;
    if (!code()) { say('先点右上角「设置」填访问码。','err'); $('#sheet').classList.add('show'); return; }

    busy = true;
    $('#input').value = ''; $('#input').style.height = 'auto';
    turn('user', text);
    chat.push({ role:'user', content:text }); saveChat();

    const wait = document.createElement('div');
    wait.className = 'turn';
    wait.innerHTML = '<div class="av">✦</div><div class="tx"><span class="dots"><i></i><i></i><i></i></span></div>';
    $('#thread').append(wait);
    window.scrollTo({ top: document.body.scrollHeight, behavior:'smooth' });

    try {
      const r = await fetch(ep() + '/chat', {
        method:'POST',
        headers:{'Content-Type':'application/json','X-Studio-Code':code()},
        body: JSON.stringify({ messages: chat.slice(-12) })
      });
      const d = await r.json().catch(()=>({}));
      wait.remove();
      if (!r.ok) throw new Error(d.detail ? d.error + '：' + d.detail : (d.error || ('失败 ' + r.status)));
      const reply = d.reply || '（没有返回内容）';
      turn('assistant', reply);
      chat.push({ role:'assistant', content:reply }); saveChat();
    } catch (e) {
      wait.remove();
      turn('assistant', '出错了：' + (e.message || '未知错误'));
    } finally {
      busy = false; $('#input').focus();
    }
  }

  /* ---------- 入口 ---------- */
  $('#run').onclick = () => { if (busy) return; if (mode === 'cover') runCover(); else runChat(); };
  $('#again').onclick = () => { if (!busy) runCover(); };
  $('#dlAll').onclick = () => {
    const as = [...document.querySelectorAll('#board .tagline a')].filter(a=>a.href);
    as.forEach((a,i) => setTimeout(()=>a.click(), i*350));
  };
  $('#copyCaps').onclick = async () => {
    const caps = [...document.querySelectorAll('#board .cap')].map(c=>c.textContent).filter(Boolean);
    if (!caps.length) return;
    try { await navigator.clipboard.writeText(caps.join('\n')); say('标题已复制','ok'); }
    catch { say('复制失败，长按手动复制','err'); }
  };
  $('#input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#run').click(); }
    if (e.key === 'Enter' && !e.shiftKey && mode === 'chat') { e.preventDefault(); $('#run').click(); }
  });
  $('#input').addEventListener('input', () => {
    const el = $('#input');
    el.style.height = 'auto';
    el.style.height = Math.min(200, el.scrollHeight) + 'px';
  });

  chat = loadChat();
  if (!code()) setTimeout(()=>$('#sheet').classList.add('show'), 350);

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
